name: generate pacman

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: chiranthkaushik
          outputs: |
            galaga-contribution-graph.svg?game=galaga
            galaga-contribution-graph-dark.svg?game=galaga&palette=github-dark
      
      - name: push github-contribution-grid-snake.svg to the pacman-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
