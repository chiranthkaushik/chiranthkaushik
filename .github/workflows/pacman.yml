name: generate galaga

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate galaga contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: chiranthkaushik
          outputs: |
            dist/galaga-contribution-graph.svg?game=galaga
            dist/galaga-contribution-graph-dark.svg?game=galaga&palette=github-dark

      - name: push to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
